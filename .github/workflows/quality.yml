name: Quality checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q src app tests

      - name: Run automated tests
        run: python -m pytest -q

      - name: Generate, validate and analyse a reproducible ledger
        run: |
          python -m src.data.generate --output-dir /tmp/stockout-generated --seed 42
          python -m src.data.validate /tmp/stockout-generated/baseline_inventory_ledger.csv --output /tmp/stockout-validation/issues.csv
          python -m src.analytics.run_analysis --input /tmp/stockout-generated/baseline_inventory_ledger.csv --output /tmp/stockout-generated/analysis.csv
          test -s /tmp/stockout-generated/analysis.csv

      - name: Train and evaluate the documented baseline
        run: |
          python -m src.models.train --input /tmp/stockout-generated/analysis.csv --output-dir /tmp/stockout-model
          python -m src.models.evaluate --input /tmp/stockout-generated/analysis.csv --model /tmp/stockout-model/baseline_logistic_regression.joblib
